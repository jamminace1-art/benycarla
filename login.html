<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti · benycarla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #07090D;
      --surface: #0D1320;
      --sf2:     #111B2A;
      --emerald: #1C6B46;
      --teal:    #167068;
      --gold:    #C8993A;
      --white:   #EDE8DC;
      --muted:   #58626E;
      --lineHi:  rgba(237,232,220,0.13);
      --rose:    #C17070;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--black);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: -8%;
      background: url('./photos/IMG_6154.PNG') center center / cover no-repeat;
      filter: blur(3px) brightness(0.28) saturate(0.7);
      transform: scale(1.08);
      z-index: 0;
    }

    /* Grain overlay for depth */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
    }

    /* ── CENTER STAGE ── */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.3s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── SOLO PARA TI LABEL ── */
    .label {
      font-size: 0.62rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease-out 0.7s forwards;
    }

    /* ── MAIN NAMES ── */
    .display-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(4rem, 14vw, 6.5rem);
      line-height: 1.0;
      letter-spacing: 0.01em;
      display: block;
      opacity: 0;
    }

    .display-name.gold {
      color: var(--gold);
      animation: fadeUp 0.8s ease-out 0.9s forwards;
    }

    .display-name.white {
      color: var(--white);
      animation: fadeUp 0.8s ease-out 1.05s forwards;
    }

    /* ── RULE ── */
    .rule-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem 0 1.8rem;
      opacity: 0;
      animation: fadeUp 0.6s ease-out 1.3s forwards;
    }

    .rule {
      width: 60px;
      height: 1px;
      background: var(--gold);
      animation: rulePulse 3.5s ease-in-out 2s infinite;
    }

    @keyframes rulePulse {
      0%, 100% { opacity: 0.5; width: 60px; }
      50%       { opacity: 1;   width: 80px; }
    }

    /* ── FORM BLOCK ── */
    .form-block {
      opacity: 0;
      animation: fadeUp 0.7s ease-out 1.5s forwards;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.02em;
      margin-bottom: 1.4rem;
      line-height: 1.6;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: var(--sf2);
      border: 1px solid var(--lineHi);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.25s ease;
      -webkit-appearance: none;
      border-radius: 0;
    }

    input::placeholder { color: var(--muted); letter-spacing: 0.04em; }

    input:focus { border-color: var(--gold); }

    /* eye toggle */
    .eye-btn {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--white); }

    /* submit */
    .btn {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
      border-radius: 0;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--black);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* error */
    .error {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--rose);
      letter-spacing: 0.04em;
      font-style: italic;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.4s ease;
    }

    .error.show {
      max-height: 2rem;
      opacity: 1;
    }

    /* ── FADE-OUT OVERLAY ── */
    .fade-cover {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.85s ease;
    }

    .fade-cover.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── FOOTER WHISPER ── */
    .whisper {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: rgba(237,232,220,0.18);
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.6s ease-out 2.2s forwards;
    }

    @media (max-width: 480px) {
      .display-name { font-size: clamp(3.5rem, 18vw, 5rem); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="stage">
    <div class="card" id="card">
      <p class="label">Solo para ti</p>
      <span class="display-name gold">Carla,</span>
      <span class="display-name white">Te amo.</span>

      <div class="rule-wrap">
        <div class="rule"></div>
      </div>

      <div class="form-block">
        <p class="hint">Escribe tu canción favorita para empezar</p>

        <div class="input-wrap">
          <input
            id="songInput"
            type="password"
            placeholder="tu respuesta…"
            autocomplete="off"
            spellcheck="false"
          >
          <button class="eye-btn" id="eyeBtn" type="button" aria-label="Mostrar texto">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button class="btn" id="submitBtn" type="button">Entrar</button>

        <p class="error" id="errorMsg">Inténtalo de nuevo, mi amor ♡</p>
      </div>
    </div>
  </div>

  <div class="fade-cover" id="fadeCover"></div>

  <p class="whisper">benycarla &nbsp;·&nbsp; 2026</p>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ── SUPABASE CONFIG ──────────────────────────────────────────
    // Fill these in after creating your Supabase project.
    // Table: site_auth  |  Column: password  |  Row value: "La Distancia"
    const SUPABASE_URL  = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON = 'YOUR_SUPABASE_ANON_KEY';
    // ─────────────────────────────────────────────────────────────

    const FALLBACK_ANSWER = 'la distancia';
    const supabaseReady = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
    const sb = supabaseReady
      ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
      : null;

    // If already authenticated, skip straight to the site
    if (localStorage.getItem('benycarla_auth') === '1') {
      window.location.replace('./index.html');
    }

    const input     = document.getElementById('songInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg  = document.getElementById('errorMsg');
    const fadeCover = document.getElementById('fadeCover');
    const eyeBtn    = document.getElementById('eyeBtn');

    // ── EYE TOGGLE ──
    let visible = false;
    eyeBtn.addEventListener('click', function () {
      visible = !visible;
      input.type = visible ? 'text' : 'password';
    });

    // ── ENTER KEY ──
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleSubmit();
    });

    // ── CLEAR ERROR ON TYPE ──
    input.addEventListener('input', function () {
      errorMsg.classList.remove('show');
    });

    submitBtn.addEventListener('click', handleSubmit);

    async function handleSubmit() {
      const raw    = input.value.trim();
      const answer = raw.toLowerCase();
      if (!answer) return;

      submitBtn.disabled = true;
      submitBtn.textContent = '…';

      let correct = false;

      if (supabaseReady) {
        try {
          const { data, error } = await sb
            .from('site_auth')
            .select('password')
            .limit(1)
            .single();

          if (!error && data) {
            correct = data.password.toLowerCase().trim() === answer;
          } else {
            // Supabase error — fall back to client check
            correct = answer === FALLBACK_ANSWER;
          }
        } catch (_) {
          correct = answer === FALLBACK_ANSWER;
        }
      } else {
        // No Supabase configured — use local check
        correct = answer === FALLBACK_ANSWER;
      }

      if (correct) {
        localStorage.setItem('benycarla_auth', '1');
        fadeCover.classList.add('active');
        setTimeout(function () {
          window.location.replace('./index.html');
        }, 900);
      } else {
        errorMsg.classList.add('show');
        input.value = '';
        input.focus();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        // Subtle shake on input
        input.style.borderColor = 'var(--rose)';
        setTimeout(function () { input.style.borderColor = ''; }, 1200);
      }
    }
  </script>
</body>
</html>
